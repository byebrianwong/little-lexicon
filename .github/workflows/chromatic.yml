# Publishes Storybook to Chromatic and compares each story against its
# baseline. Turn this on by setting the repository variable
# CHROMATIC_ENABLED to "true" and adding the CHROMATIC_PROJECT_TOKEN secret.
# Until then the job is skipped, so the workflow is safe to merge early.
#
# This job does not gate merges on visual changes. Chromatic's GitHub app
# posts a "UI Tests" status on each commit, and the main ruleset requires
# that status. It stays pending until every change is accepted or denied in
# Chromatic, then turns green with no re-run. When TurboSnap bypasses a
# commit's build, Chromatic carries the earlier build's pending status over
# to that commit. A pull request from a fork gets no status, because this job
# is skipped for it, so the ruleset holds it until an admin bypasses it.
name: Chromatic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chromatic:
    name: Visual tests
    # A pull request from a fork cannot read repository secrets, so the job
    # would fail on a token it never receives.
    if: >-
      vars.CHROMATIC_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic picks a baseline from git history. A shallow clone leaves
          # it with nothing to compare against, so every story reads as new.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Publish to Chromatic
        uses: chromaui/action@v18.9.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Only snapshot stories whose code actually changed.
          onlyChanged: true
          # Visual changes are reviewed through the required "UI Tests"
          # status (see the top of this file), so they do not fail this job.
          # A story that errors or fails its play function still fails the
          # build, and the status with it.
          exitZeroOnChanges: true
