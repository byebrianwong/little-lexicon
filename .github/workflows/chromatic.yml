# Publishes Storybook to Chromatic and compares each story against its
# baseline. Turn this on by setting the repository variable
# CHROMATIC_ENABLED to "true" and adding the CHROMATIC_PROJECT_TOKEN secret.
# Until then the job is skipped, so the workflow is safe to merge early.
name: Chromatic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chromatic:
    name: Visual tests
    # A pull request from a fork cannot read repository secrets, so the job
    # would fail on a token it never receives.
    if: >-
      vars.CHROMATIC_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The last step reads the "UI Tests" status Chromatic posts on the commit.
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic picks a baseline from git history. A shallow clone leaves
          # it with nothing to compare against, so every story reads as new.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Publish to Chromatic
        uses: chromaui/action@v18.9.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Only snapshot stories whose code actually changed.
          onlyChanged: true
          # An unreviewed visual change fails this job. "Visual tests" is a
          # required check on main, so the pull request cannot merge until
          # someone accepts or denies the diff in the Chromatic UI. Re-run the
          # job after accepting to turn it green.
          exitZeroOnChanges: false
      # The step above can pass with changes still unreviewed. When a commit
      # touches no story's files, TurboSnap bypasses the build and the CLI
      # exits 0 without checking anything, even if an earlier build on the
      # branch is still waiting for review or still running. Chromatic carries
      # that earlier result over to its "UI Tests" status on the commit, so
      # this step waits for that status and passes only when it is success.
      # Forks never reach this step, because the whole job is skipped for them.
      - name: Check Chromatic's UI Tests status
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-ui-tests-status.sh
